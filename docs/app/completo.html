body{margin:0;font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);font-size:14px;line-height:1.5;display:flex;min-height:100vh}
button,input,select,textarea{font:inherit;color:inherit}
a{color:inherit}
.sr{position:absolute;left:-9999px}
/* sidebar */
#side{width:248px;flex:none;background:var(--dark);color:var(--nav);height:100vh;position:sticky;top:0;display:flex;flex-direction:column;padding:16px;gap:6px;overflow:auto;z-index:20}
.brand{display:flex;align-items:center;gap:10px;margin-bottom:2px}
.mono{width:34px;height:34px;border-radius:8px;background:var(--gold);color:var(--dark);font-weight:800;display:grid;place-items:center}
.brand img{width:44px;height:44px;border-radius:50%;flex:none}.brand b{color:#fff;font-size:16px}.hero .row0{display:flex;align-items:center;gap:18px}.hero .row0 img{width:76px;height:76px;border-radius:50%;flex:none}.tagline{font-size:11px;color:var(--nav);margin:0 0 8px}
.grp{font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:#7d8090;margin:14px 6px 4px}
.nav{display:flex;align-items:center;gap:12px;width:100%;border:0;background:none;color:var(--nav);text-decoration:none;padding:8px 10px;border-radius:7px;cursor:pointer;font-size:13px;text-align:left}
.nav svg{width:18px;height:18px;flex:none}
.nav:hover{background:#1a1a26;color:#fff}
.nav.on{background:var(--active);color:var(--gold);font-weight:700;box-shadow:inset 3px 0 var(--gold),inset 0 0 0 .5px #5b4b12}
.sfoot{margin-top:auto;font-size:10.5px;color:#8d90a0;padding:12px 6px 0;line-height:1.6}.sfoot b{color:var(--gold);font-weight:600}
/* main */
#wrap{flex:1;min-width:0;display:flex;flex-direction:column}
header.top{background:var(--card);border-bottom:1px solid var(--line);padding:14px 32px;display:flex;align-items:center;gap:16px;position:sticky;top:0;z-index:10}
#menu{display:none;border:1px solid var(--line);background:var(--card);border-radius:8px;width:38px;height:38px;cursor:pointer}
header h1{margin:0;font-size:22px;line-height:1.2}
header .rf{font-size:12px;color:var(--muted);margin-top:2px}
.sp{flex:1}
.chip{display:inline-flex;align-items:center;gap:8px;background:var(--pale);color:var(--goldink);font-weight:700;font-size:12px;border:0;border-radius:8px;padding:8px 12px;cursor:pointer;text-decoration:none}
.chip svg{width:16px;height:16px}
main{padding:28px 32px 56px;max-width:1280px;width:100%}
.stack{display:flex;flex-direction:column;gap:20px}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:22px}
.card h2,.card h3{margin:0 0 6px;font-size:18px}
.card h3{font-size:16px}
.muted{color:var(--muted)}.small{font-size:12px}
.hero{background:var(--dark);color:#fff;border-radius:16px;padding:36px;border:0}
.hero h2{font-size:30px;margin:0 0 10px;line-height:1.2}.hero p{color:var(--nav);font-size:16px;max-width:760px;margin:0 0 20px}
.kpi{padding:18px 20px}.kpi .n{font-size:30px;font-weight:800;color:var(--goldink);line-height:1.1}.kpi .l{font-weight:700;margin-top:4px}
.btn{color:var(--ink);border:1px solid var(--line);background:var(--card);border-radius:8px;padding:9px 16px;font-weight:700;font-size:13px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:8px;justify-content:center}
.btn:hover{border-color:var(--gold)}
.btn.gold{background:var(--gold);border-color:var(--gold);color:#1a1a1a}.btn.gold:hover{filter:brightness(1.06)}
.btn.dark{background:var(--dark);border-color:var(--dark);color:#fff}
.btn.sm{padding:5px 10px;font-size:12px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.tabs{display:flex;gap:8px;flex-wrap:wrap}
.tab{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:8px 14px;font-weight:700;font-size:13px;cursor:pointer}
.tab.on{background:var(--gold);border-color:var(--gold);color:#1a1a1a}
.tw{overflow:auto;border-radius:10px}
table{width:100%;border-collapse:separate;border-spacing:0 6px;font-size:13.5px}
th{background:var(--pale);color:var(--goldink);text-align:left;padding:10px 12px;font-size:12px;position:sticky;top:0}
th:first-child{border-radius:8px 0 0 8px}th:last-child{border-radius:0 8px 8px 0}
td{background:var(--field);padding:11px 12px}
td:first-child{border-radius:8px 0 0 8px}td:last-child{border-radius:0 8px 8px 0}
tr.click{cursor:pointer}tr.click:hover td{outline:1px solid var(--gold);outline-offset:-1px}
.badge{display:inline-block;border-radius:999px;padding:2px 10px;font-size:12px;font-weight:700}
.b-warn{background:var(--warnbg);color:var(--warn)}.b-info{background:var(--infobg);color:var(--info)}.b-ok{background:var(--okbg);color:var(--ok)}.b-bad{background:var(--badbg);color:var(--bad)}.b-gray{background:var(--field);color:var(--muted)}
/* forms */
form{display:grid;gap:14px}
.f{display:flex;flex-direction:column;gap:5px}
.f label{font-weight:700;font-size:13px}
.f input,.f select,.f textarea{background:var(--field);border:1px solid var(--line);border-radius:8px;padding:10px 12px;width:100%}
.f input:focus,.f select:focus,.f textarea:focus,.btn:focus-visible,.tab:focus-visible,.nav:focus-visible,.chip:focus-visible{outline:2px solid var(--gold);outline-offset:1px}
.f .h{font-size:12px;color:var(--muted)}
.f.err input,.f.err select,.f.err textarea{border-color:var(--bad)}
.f .e{font-size:12px;color:var(--bad);font-weight:600;min-height:0}
.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.calc{background:var(--pale);color:var(--goldink);border-radius:10px;padding:12px 14px;font-weight:700;font-size:13.5px}
.callout{background:var(--pale);color:var(--goldink);border-radius:10px;padding:14px 18px}
.callout b{display:block;margin-bottom:2px}
.pcard{display:flex;flex-direction:column;gap:8px}
.pcard .price{font-weight:800;font-size:18px}
.steps{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.steps li{display:flex;gap:14px;align-items:flex-start;background:var(--field);border-radius:10px;padding:14px 16px}
.steps .num{flex:none;width:32px;height:32px;border-radius:50%;background:var(--gold);color:#1a1a1a;font-weight:800;display:grid;place-items:center}
.gal{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}
.gal figure{margin:0;background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.gal img{display:block;width:100%;height:auto}.gal figcaption{padding:12px 16px}.gal small{color:var(--muted);display:block}
.qgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.q .k{font-size:28px;font-weight:800;color:var(--goldink)}
.tl{display:flex;gap:0;margin:14px 0 4px}.tl div{flex:1;text-align:center;font-size:12px;color:var(--muted);position:relative;padding-top:20px}
.tl div::before{content:"";position:absolute;top:2px;left:50%;width:14px;height:14px;margin-left:-7px;border-radius:50%;background:var(--line)}
.tl div::after{content:"";position:absolute;top:8px;left:-50%;width:100%;height:2px;background:var(--line);z-index:0}
.tl div:first-child::after{display:none}.tl div.on{color:var(--ink);font-weight:700}.tl div.on::before{background:var(--gold)}.tl div.on::after{background:var(--gold)}
#toast{position:fixed;right:20px;bottom:20px;display:grid;gap:8px;z-index:60}
.t{background:var(--dark);color:#fff;border-left:4px solid var(--gold);padding:12px 16px;border-radius:8px;box-shadow:0 8px 24px #0004;max-width:360px;animation:in .2s}
.t.bad{border-color:#ff7b72}
@keyframes in{from{transform:translateY(8px);opacity:0}}
#modal{position:fixed;inset:0;background:#0007;display:none;place-items:center;z-index:50;padding:16px}
#modal.on{display:grid}
#modal .box{background:var(--card);border-radius:14px;max-width:560px;width:100%;max-height:90vh;overflow:auto;padding:24px;border:1px solid var(--line)}
dl{display:grid;grid-template-columns:150px 1fr;gap:8px 12px;margin:12px 0}dt{color:var(--muted)}dd{margin:0;font-weight:600}
.dis{display:none}
.nodata{padding:28px;text-align:center;color:var(--muted)}
@media(max-width:1080px){.g4{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:repeat(2,1fr)}}
@media(max-width:900px){
 #side{position:fixed;left:-270px;transition:left .2s;box-shadow:0 0 40px #0008}#side.open{left:0}
 #menu{display:grid;place-items:center}
 header.top{padding:12px 16px}main{padding:18px 16px 40px}
 .g2,.g3,.g4,.two,.qgrid,.gal{grid-template-columns:1fr}
 .hero{padding:24px}.hero h2{font-size:24px}
 header h1{font-size:18px}dl{grid-template-columns:1fr}
}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}html{scroll-behavior:auto}}
</style>

/* validación */
function field(id,label,{type="text",ph="",hint="",val="",opts,req=true,attrs=""}={}){
 const inner=opts?`<select id="${id}" name="${id}" ${attrs}>${opts.map(o=>{const[v,t]=Array.isArray(o)?o:[o,o];return`<option value="${esc(v)}" ${String(v)===String(val)?"selected":""}>${esc(t)}</option>`}).join("")}</select>`
 :type==="textarea"?`<textarea id="${id}" name="${id}" rows="3" placeholder="${esc(ph)}" ${attrs}>${esc(val)}</textarea>`
 :`<input id="${id}" name="${id}" type="${type}" placeholder="${esc(ph)}" value="${esc(val)}" ${attrs}>`;
 return`<div class="f" data-f="${id}"><label for="${id}">${label}${req?" *":""}</label>${inner}${hint?`<span class="h">${hint}</span>`:""}<span class="e" aria-live="polite"></span></div>`}
function setErr(form,id,msg){const f=$(`[data-f="${id}"]`,form);if(!f)return;f.classList.toggle("err",!!msg);$(".e",f).textContent=msg||""}
function check(form,rules){let ok=true,first=null;for(const[id,fn]of Object.entries(rules)){const el=form.elements[id];if(!el)continue;const m=fn(el.value.trim(),el);setErr(form,id,m);if(m){ok=false;first=first||el}}first&&first.focus();return ok}

 f=$("#pgf");if(f)f.onsubmit=e=>{e.preventDefault();const f=e.target;if(!check(f,{valor:R.pos}))return;const b=f.tipo.value.startsWith("Bono");S.pagos.unshift({id:b?nid("bon","BON-"):nid("pay","PAY-"),tr:f.tr.value,tipo:f.tipo.value,valor:Math.round(fl(f.valor.value)),fecha:today()});save();toast("Pago registrado");rerender()}};

/* ----- Presupuesto ----- */
VIEWS.presupuesto=()=>{const ga=S.gastos.reduce((a,g)=>a+g.v,0),pa=S.pagos.reduce((a,p)=>a+p.valor,0),disp=S.presupuesto-ga-pa;
 return`<div class="stack"><section class="grid g3"><div class="card kpi"><div class="n" style="font-size:24px">${cop(S.presupuesto)}</div><div class="l">Presupuesto general</div></div><div class="card kpi"><div class="n" style="font-size:24px">${cop(ga+pa)}</div><div class="l">Gastos y nómina</div></div><div class="card kpi"><div class="n" style="font-size:24px;color:${disp<0?"var(--bad)":"var(--ok)"}">${cop(disp)}</div><div class="l">Fondos disponibles</div></div></section>
 <div class="grid g2" style="align-items:start"><section class="card"><h2>Registro de gastos</h2><p class="muted">Egresos por combustible, herramientas y mantenimiento de maquinaria.</p>${table(["Concepto","Detalle","Valor","Fecha"],S.gastos.map(g=>({cells:[esc(g.c),esc(g.d),cop(g.v),g.fecha]})))}
  <form id="gf" novalidate style="margin-top:12px"><div class="two">${field("c","Concepto",{opts:["Combustible","Herramientas","Mantenimiento","Otros"]})}${field("v","Valor (COP)",{ph:"Ej: 300000"})}</div>${field("d","Detalle",{ph:"Descripción breve"})}<div><button class="btn gold" type="submit">Añadir gasto</button></div></form></section>
 <section class="card"><h2>Novedades operativas</h2><p class="muted">Reportes del estado técnico de la mina.</p><div class="stack" style="gap:8px">${S.nov.map(n=>`<div class="callout" style="background:var(--badbg);color:var(--bad)"><b style="font-weight:600">${esc(n.t)}</b><span class="small">${n.fecha}</span></div>`).join("")}</div>
  <form id="nf" novalidate style="margin-top:12px">${field("t","Nueva novedad",{ph:"Ej: Falla en banda transportadora"})}<div><button class="btn dark" type="submit">Reportar</button></div></form></section></div></div>`};
AFTER.presupuesto=()=>{let f=$("#gf");f.onsubmit=e=>{e.preventDefault();const f=e.target;if(!check(f,{v:R.pos,d:R.req}))return;S.gastos.unshift({id:nid("gas","GA-"),c:f.c.value,d:f.d.value.trim(),v:Math.round(fl(f.v.value)),fecha:today()});save();toast("Gasto registrado");rerender()};
 f=$("#nf");f.onsubmit=e=>{e.preventDefault();const f=e.target;if(!check(f,{t:R.req}))return;S.nov.unshift({id:nid("nov","NV-"),t:f.t.value.trim(),fecha:today()});save();toast("Novedad reportada");rerender()}};

 ["RF-N01","Acceso por roles (Cliente, Vendedor, Trabajador, Administrador).","login"],["RF-N02","Registrar y consultar trabajadores.","personal"],["RF-N03","Horarios y asistencia diaria.","jornada"],["RF-N04","Pagos y bonificaciones del personal.","personal"],["RF-N05","Registro y consulta de producción de oro.","produccion"],["RF-N06","Presupuesto y registro de gastos.","presupuesto"],["RF-N07","Novedades operativas de la mina.","presupuesto"]];

/* ============ eventos globales ============ */
document.addEventListener("click",e=>{const el=e.target.closest("[data-act]");if(!el)return;const a=el.dataset.act,v=el.dataset.v;
 if(a==="cat"){CATF=v;rerender()}
 else if(a==="rol"){LROL=v;rerender()}
 else if(a==="badlogin"){const f=$("#lf");f.correo.value="alguien@mal.com";f.pass.value="ClaveIncorrecta1";f.requestSubmit()}
 else if(a==="logout"){setSession(null);toast("Sesión cerrada");go("inicio")}
 else if(a==="solfil"){SOLFIL=v;rerender()}
 else if(a==="soldet")solDetail(v);
 else if(a==="solsave"){const s=S.solicitudes.find(x=>x.id===v),n=$("#nst").value;
   if(n==="Finalizada"&&s.estado!=="Finalizada"&&s.srv==="Venta de oro"&&s.ref){const p=prod(s.ref);if(p){if(p.stock<(s.cant||1)){toast("Stock insuficiente de "+p.nombre+" para finalizar la venta.",true);return}p.stock-=(s.cant||1)}}
   s.estado=n;save();closeModal();toast(s.id+" → "+n);rerender()}
 else if(a==="cldet")clDetail(v);
 else if(a==="stk"){const p=prod(v);p.stock=Math.max(0,p.stock+(+el.dataset.d));save();rerender()}
 else if(a==="prf"){PRF.k=v;rerender()}
 else if(a==="ptab"){PTAB=v;rerender()}
 else if(a==="marcar"){const code=($("#cod").value||"").trim().toUpperCase();if(!S.trab.some(t=>t.id===code)){toast("Código de trabajador no válido.",true);return}
   const hoy=S.asist.find(x=>x.tr===code&&x.fecha===today()&&!x.out);
   if(v==="in"){if(hoy){toast("Ya hay una entrada abierta hoy.",true);return}S.asist.push({tr:code,fecha:today(),in:nowT(),out:""});toast("Entrada registrada "+nowT())}
   else{if(!hoy){toast("No hay una entrada abierta para marcar salida.",true);return}hoy.out=nowT();toast("Salida registrada "+nowT())}
   save();rerender()}});
document.addEventListener("keydown",e=>{if(e.key==="Enter"&&e.target.matches("tr.click"))e.target.click()});
route();
</script>
